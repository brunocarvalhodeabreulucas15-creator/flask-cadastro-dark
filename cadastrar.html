<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0A0B;font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;color:#fff}
  .form-box{background:#141417;border:1px solid #232328;width:100%;max-width:400px;padding:32px;border-radius:20px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
  .top h2{font-size:20px;font-weight:600;letter-spacing:-0.5px}
  .top a{color:#9F9FA9;text-decoration:none;font-size:13px}
  .top a:hover{color:#fff}
  input{width:100%;padding:14px 16px;background:#0A0A0B;border:1px solid #2A2A30;border-radius:12px;color:#fff;font-size:15px;outline:none;transition:0.2s;margin-bottom:14px}
  input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.08)}
  input::placeholder{color:#5A5A66}
  button{width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;margin-top:8px;transition:0.2s}
  button:hover{background:#EAEAEA;transform:translateY(-1px)}
  .hint{margin-top:16px;text-align:center;color:#5A5A66;font-size:12px}
</style>
</head>
<body>
  <form class="form-box" method="POST">
    <div class="top">
      <h2>Criar conta</h2>
      <a href="{{ url_for('homepag') }}">← Voltar</a>
    </div>
    <input type="text" name="nome" placeholder="Seu nome" required>
    <input type="number" name="idade" placeholder="Sua idade" required min="1">
    <input type="email" name="email" placeholder="Seu e-mail" required>
    <button type="submit">Cadastrar</button>
    <div class="hint">Dados salvos em SQLite localmente</div>
  </form>
</body>
</html>
